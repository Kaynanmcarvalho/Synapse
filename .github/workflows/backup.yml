name: Backup GCP

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_BACKUP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Garantir versionamento do bucket de backup
        run: gcloud storage buckets update "gs://$BACKUP_BUCKET" --versioning
        env:
          BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
      - name: Exportar Firestore e Storage
        run: node scripts/backup-gcp.mjs
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          SOURCE_STORAGE_BUCKET: ${{ vars.SOURCE_STORAGE_BUCKET }}
          BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
