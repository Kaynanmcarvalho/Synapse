name: Restore drill

on:
  workflow_dispatch:
    inputs:
      backup_root: { description: 'gs://... do backup', required: true }
      target_environment: { type: choice, options: [development, staging], required: true }
      confirmation: { description: '<project>:<backup_root>', required: true }

permissions:
  contents: read
  id-token: write

jobs:
  restore:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_RESTORE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Restaurar em ambiente não produtivo
        run: node scripts/restore-gcp.mjs
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          TARGET_STORAGE_BUCKET: ${{ vars.SOURCE_STORAGE_BUCKET }}
          BACKUP_ROOT: ${{ inputs.backup_root }}
          CONFIRM_RESTORE: ${{ inputs.confirmation }}
